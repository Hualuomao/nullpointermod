loaderVersion="[43,)"
license="MIT"

[[mods]]
modId="nullpointermod"
version="${file.jarVersion}"
displayName="Null Pointer Mod"
displayURL="https://github.com/Hualuomao/nullpointermod"
logoFile="logo.png"
credits="Created by Hualuomao"
authors="Hualuomao"
description="""A Minecraft mod that turns java.lang.NullPointerException into a weapon!

【玩法】
1. Craft the "Java" item with rare materials (Nether Star + Netherite + Ender Eyes).
2. Right-click air while holding it to generate a "Null Pointer" item.
3. Right-click to launch it as a projectile.

【崩溃触发】
- Hitting a block → shooter's client crashes!
- Hitting yourself → self-destruct crash!
- Flying for 10 seconds → timeout crash!

【防滥用机制】
- Max 16 per player
- Global limit: 128
- 30-second despawn for dropped items
- 5-second cooldown

Server-friendly: the server never crashes, only the shooter's client does!
Ideal for trolling friends and creating funny moments."""

[[dependencies.nullpointermod]]
    modId="forge"
    mandatory=true
    versionRange="[43,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.nullpointermod]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"
